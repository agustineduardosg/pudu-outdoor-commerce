version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Santiago
    open-pull-requests-limit: 5
    groups:
      development:
        dependency-type: development
      production:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:30"
      timezone: America/Santiago

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "11:00"
      timezone: America/Santiago
